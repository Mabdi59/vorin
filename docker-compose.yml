version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vorin-postgres
    environment:
      POSTGRES_DB: vorin
      POSTGRES_USER: vorin_user
      POSTGRES_PASSWORD: vorin_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vorin_user -d vorin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
