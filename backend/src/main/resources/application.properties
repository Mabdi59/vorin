# Server Configuration
server.port=8080
spring.application.name=vorin-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/vorin
spring.datasource.username=vorin_user
spring.datasource.password=vorin_pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=vorin-secret-key-change-this-in-production-use-a-long-secure-random-string
jwt.expiration=86400000

# CORS Configuration
cors.allowed-origins=http://localhost:5173

# WebSocket Configuration
spring.websocket.allowed-origins=http://localhost:5173
